<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Dash Mini</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000c20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #0d0f1a;
    }
    .instructions {
      margin-top: 15px;
      font-size: 14px;
      color: #8a99ad;
      text-align: center;
    }
    kbd {
      background: #1a2236;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>
  <div class="instructions">
    Nhấn <kbd>Space</kbd>, <kbd>Click Chuột</kbd> hoặc <kbd>Chạm màn hình</kbd> để nhảy.
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Cấu hình Game
    const GRAVITY = 0.65;
    const JUMP_FORCE = -10.5;
    const SPEED = 6;
    const GROUND_Y = 320;

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let attempts = 1;
    let score = 0;
    let animationFrameId;

    // Đối tượng Player (Khối vuông)
    const player = {
      x: 100,
      y: GROUND_Y - 30,
      size: 30,
      vy: 0,
      rotation: 0,
      isGrounded: true,
      reset() {
        this.y = GROUND_Y - this.size;
        this.vy = 0;
        this.rotation = 0;
        this.isGrounded = true;
      },
      jump() {
        if (this.isGrounded) {
          this.vy = JUMP_FORCE;
          this.isGrounded = false;
        }
      },
      update() {
        this.vy += GRAVITY;
        this.y += this.vy;

        // Chạm đất
        if (this.y >= GROUND_Y - this.size) {
          this.y = GROUND_Y - this.size;
          this.vy = 0;
          this.isGrounded = true;
          // Làm tròn góc xoay về bội số của 90 độ khi chạm đất
          this.rotation = Math.round(this.rotation / (Math.PI / 2)) * (Math.PI / 2);
        } else {
          // Xoay khi đang ở trên không
          this.rotation += 0.15;
        }
      },
      draw() {
        ctx.save();
        ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
        ctx.rotate(this.rotation);

        // Thân khối vuông (Màu vàng Neon)
        ctx.fillStyle = '#ffe600';
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);

        // Viền
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);

        // Mắt khối vuông
        ctx.fillStyle = '#000';
        ctx.fillRect(-6, -8, 5, 5);
        ctx.fillRect(2, -8, 5, 5);
        ctx.fillRect(-4, 2, 8, 3);

        ctx.restore();
      }
    };

    // Quản lý Chướng ngại vật
    let obstacles = [];
    let spawnTimer = 0;

    function createObstacle() {
      const types = ['spike', 'double_spike', 'block'];
      const type = types[Math.floor(Math.random() * types.length)];

      if (type === 'spike') {
        obstacles.push({
          x: canvas.width,
          y: GROUND_Y,
          width: 30,
          height: 30,
          type: 'spike'
        });
      } else if (type === 'double_spike') {
        obstacles.push({
          x: canvas.width,
          y: GROUND_Y,
          width: 60,
          height: 30,
          type: 'double_spike'
        });
      } else if (type === 'block') {
        obstacles.push({
          x: canvas.width,
          y: GROUND_Y - 30,
          width: 35,
          height: 30,
          type: 'block'
        });
      }
    }

    // Hiệu ứng nổ khi chết
    let particles = [];
    function createExplosion(x, y) {
      particles = [];
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 6 + 2,
          color: '#ffe600',
          life: 30
        });
      }
    }

    // Vẽ nền và mặt đất
    let bgOffset = 0;
    function drawBackground() {
      // Nền chuyển màu Gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#00112c');
      gradient.addColorStop(1, '#000511');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Đường kẻ đệm nền
      bgOffset = (bgOffset + 1) % 40;
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
      ctx.lineWidth = 1;
      for (let x = -bgOffset; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, GROUND_Y);
        ctx.stroke();
      }

      // Mặt đất
      ctx.fillStyle = '#002b47';
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // Đường viền sáng mặt đất
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();
    }

    // Kiểm tra Va chạm
    function checkCollision(player, obs) {
      if (obs.type === 'spike' || obs.type === 'double_spike') {
        // Kiểm tra va chạm hộp thu nhỏ cho Gai
        const pLeft = player.x + 5;
        const pRight = player.x + player.size - 5;
        const pTop = player.y + 5;
        const pBottom = player.y + player.size;

        const oLeft = obs.x + 5;
        const oRight = obs.x + obs.width - 5;
        const oTop = obs.y - obs.height;
        const oBottom = obs.y;

        return !(pRight < oLeft || pLeft > oRight || pBottom < oTop || pTop > oBottom);
      } else if (obs.type === 'block') {
        return (
          player.x < obs.x + obs.width &&
          player.x + player.size > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.size > obs.y
        );
      }
      return false;
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      createExplosion(player.x + player.size / 2, player.y + player.size / 2);
    }

    function restartGame() {
      attempts++;
      score = 0;
      obstacles = [];
      spawnTimer = 0;
      player.reset();
      gameState = 'PLAYING';
    }

    // Game Loop Chính
    function gameLoop() {
      drawBackground();

      if (gameState === 'START') {
        player.draw();
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GEOMETRY DASH MINI', canvas.width / 2, 140);
        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('Nhấn Space / Click để bắt đầu', canvas.width / 2, 190);
      } 
      else if (gameState === 'PLAYING') {
        score++;
        player.update();
        player.draw();

        // Sinh chướng ngại vật
        spawnTimer++;
        if (spawnTimer > 80 + Math.random() * 50) {
          createObstacle();
          spawnTimer = 0;
        }

        // Cập nhật và vẽ chướng ngại vật
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= SPEED;

          // Vẽ gai / khối
          if (obs.type === 'spike') {
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y);
            ctx.lineTo(obs.x + obs.width / 2, obs.y - obs.height);
            ctx.lineTo(obs.x + obs.width, obs.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
          } else if (obs.type === 'double_spike') {
            ctx.fillStyle = '#ff0055';
            for (let j = 0; j < 2; j++) {
              ctx.beginPath();
              ctx.moveTo(obs.x + j * 30, obs.y);
              ctx.lineTo(obs.x + j * 30 + 15, obs.y - obs.height);
              ctx.lineTo(obs.x + (j + 1) * 30, obs.y);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }
          } else if (obs.type === 'block') {
            ctx.fillStyle = '#00ccff';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
          }

          // Kiểm tra va chạm
          if (checkCollision(player, obs)) {
            triggerGameOver();
          }

          // Xóa chướng ngại vật ra khỏi màn hình
          if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
          }
        }

        // Hiển thị điểm & Attempt
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Attempt ${attempts}`, 20, 35);
        ctx.fillText(`Score: ${Math.floor(score / 10)}m`, 20, 60);
      } 
      else if (gameState === 'GAMEOVER') {
        // Cập nhật hạt nổ
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 140);

        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Score: ${Math.floor(score / 10)}m`, canvas.width / 2, 180);
        ctx.fillText('Nhấn Space / Click để chơi lại', canvas.width / 2, 220);
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Sự kiện điều khiển
    function handleAction() {
      if (gameState === 'START') {
        gameState = 'PLAYING';
      } else if (gameState === 'PLAYING') {
        player.jump();
      } else if (gameState === 'GAMEOVER') {
        restartGame();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleAction();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handleAction();
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleAction();
    });

    // Chạy Game Loop
    gameLoop();
  </script>
</body>
</html>
