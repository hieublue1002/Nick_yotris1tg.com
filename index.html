<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick.yotris1tg | Vocab & Idiom Practice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1rem;
        }

        .brand {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-group {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .badge-type {
            background: rgba(129, 140, 248, 0.1);
            color: #a5b4fc;
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .term-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        .phonetic {
            color: #94a3b8;
            font-size: 1rem;
            font-style: italic;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: #f8fafc;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .btn-check {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-check:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.6);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
        }

        .feedback-banner {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .feedback-correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border: 1px solid rgba(16, 185, 129, 0.5) !important;
            color: #34d399 !important;
        }

        .feedback-incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border: 1px solid rgba(239, 68, 68, 0.5) !important;
            color: #f87171 !important;
        }

        .answer-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 1.2rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .answer-box.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .definition-en {
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            color: #e2e8f0;
        }

        .definition-vi {
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            color: #34d399;
            font-weight: 500;
        }

        .example {
            font-size: 0.85rem;
            color: #94a3b8;
            font-style: italic;
            border-left: 2px solid #38bdf8;
            padding-left: 10px;
        }

        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="brand">Nick.yotris1tg</div>
            <div class="badge-group">
                <span class="badge" id="level-badge">B2</span>
                <span class="badge badge-type" id="type-badge">Adjective</span>
            </div>
        </div>

        <div class="term-container">
            <h1 id="term-display">Loading...</h1>
            <div class="phonetic" id="phonetic-display"></div>
        </div>

        <div class="input-group">
            <label for="user-guess">Your definition guess (Press Enter to check):</label>
            <textarea id="user-guess" placeholder="Write your guess here and press Enter..."></textarea>
        </div>

        <div id="feedback-banner" class="feedback-banner"></div>

        <div class="btn-group">
            <button class="btn-check" onclick="checkAnswer()">Check Answer</button>
            <button class="btn-secondary" onclick="revealMeaning()">Reveal Only</button>
            <button class="btn-primary" onclick="generateNewTerm()">Next Word</button>
        </div>

        <div class="answer-box" id="answer-box">
            <div class="section-title">English Meaning</div>
            <div class="definition-en" id="definition-en-display"></div>

            <div class="section-title">Nghĩa Tiếng Việt</div>
            <div class="definition-vi" id="definition-vi-display"></div>

            <div class="section-title">Example</div>
            <div class="example" id="example-display"></div>
        </div>

        <div class="footer">
            Powered by Free Dictionary API • Nick.yotris1tg
        </div>
    </div>

    <script>
        // Expanded seed bank of English words across levels
        const wordList = [
            "Substantial", "Ambiguous", "Incentive", "Meticulous", "Pragmatic", 
            "Consolidate", "Ubiquitous", "Ephemeral", "Acquiesce", "Resilient",
            "Eloquent", "Scrutinize", "Profound", "Inevitable", "Plausible",
            "Adversity", "Benevolent", "Candid", "Diligent", "Empathy",
            "Fostering", "Granular", "Harmonious", "Impartial", "Juxtapose"
        ];

        let currentItem = null;

        async function fetchWordFromAPI(word) {
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (!response.ok) throw new Error("Network response error");
                const data = await response.json();
                
                const entry = data[0];
                const meaning = entry.meanings[0];
                const defObj = meaning.definitions[0];

                return {
                    term: entry.word,
                    level: "API Online",
                    type: meaning.partOfSpeech || "Vocabulary",
                    phonetic: entry.phonetic || (entry.phonetics[0] ? entry.phonetics[0].text : ""),
                    defEN: defObj.definition,
                    defVI: "Tra cứu từ điển để xem dịch nghĩa chi tiết.",
                    keywords: defObj.definition.toLowerCase().split(" ").slice(0, 5),
                    example: defObj.example || "No example provided by the dictionary entry."
                };
            } catch (err) {
                return null;
            }
        }

        async function generateNewTerm() {
            document.getElementById('term-display').innerText = "Loading...";
            document.getElementById('phonetic-display').innerText = "";
            
            const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
            const fetchedData = await fetchWordFromAPI(randomWord);

            if (fetchedData) {
                currentItem = fetchedData;
            } else {
                currentItem = {
                    term: randomWord,
                    level: "Vocabulary",
                    type: "Word",
                    phonetic: "",
                    defEN: "Definition could not be retrieved dynamically.",
                    defVI: "Không thể lấy dữ liệu.",
                    keywords: [],
                    example: "-"
                };
            }

            document.getElementById('level-badge').innerText = currentItem.level;
            document.getElementById('type-badge').innerText = currentItem.type;
            document.getElementById('term-display').innerText = currentItem.term;
            document.getElementById('phonetic-display').innerText = currentItem.phonetic;
            document.getElementById('definition-en-display').innerText = currentItem.defEN;
            document.getElementById('definition-vi-display').innerText = currentItem.defVI;
            document.getElementById('example-display').innerText = `"${currentItem.example}"`;

            document.getElementById('user-guess').value = '';
            document.getElementById('answer-box').classList.remove('visible');
            
            const feedback = document.getElementById('feedback-banner');
            feedback.style.display = 'none';
            feedback.className = 'feedback-banner';
        }

        function checkAnswer() {
            const userGuess = document.getElementById('user-guess').value.trim().toLowerCase();
            const feedback = document.getElementById('feedback-banner');

            if (!userGuess) {
                feedback.innerText = "⚠️ Please type a guess first before checking!";
                feedback.className = "feedback-banner feedback-incorrect";
                feedback.style.display = "block";
                revealMeaning();
                return;
            }

            const isMatch = currentItem.keywords.some(kw => kw.length > 3 && userGuess.includes(kw.toLowerCase()));

            if (isMatch) {
                feedback.innerText = "✓ Great job! The guess matches key definitions.";
                feedback.className = "feedback-banner feedback-correct";
            } else {
                feedback.innerText = "✕ Not quite right! Compare the guess with the official meaning below.";
                feedback.className = "feedback-banner feedback-incorrect";
            }

            feedback.style.display = "block";
            revealMeaning();
        }

        function revealMeaning() {
            document.getElementById('answer-box').classList.add('visible');
        }

        window.onload = function() {
            generateNewTerm();

            const textarea = document.getElementById('user-guess');
            textarea.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    checkAnswer();
                }
            });
        };
    </script>

</body>
</html>
