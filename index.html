<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 500px; width: 100%; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn { background: #0284c7; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; transition: background 0.2s ease; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <p>Custom landing page running on GitHub Pages.</p>
        <div class="links">
            <a href="https://github.com" class="btn">GitHub Profile</a>
            <a href="#" class="btn">Project Link</a>
        </div>
    </div>
</body>
</html>
