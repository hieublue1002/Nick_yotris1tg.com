<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick.yotris1tg | Advanced Vocab & Idiom Trainer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 2.5rem 2rem; max-width: 620px; width: 100%; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 1rem; }
        .brand { font-weight: 800; font-size: 0.95rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls { display: flex; gap: 8px; align-items: center; }
        select { background: rgba(15, 23, 42, 0.8); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 4px 8px; font-size: 0.8rem; font-weight: 700; outline: none; cursor: pointer; }
        .badge { padding: 4px 10px; font-size: 0.75rem; font-weight: 700; border-radius: 20px; text-transform: uppercase; background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
        .badge-type { background: rgba(129, 140, 248, 0.1); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.2); }
        .term-container { text-align: center; margin-bottom: 1.5rem; }
        h1 { font-size: 2.2rem; font-weight: 800; color: #ffffff; margin-bottom: 0.2rem; }
        .phonetic { color: #94a3b8; font-size: 1rem; font-style: italic; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 500; }
        textarea { width: 100%; height: 80px; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 12px; padding: 12px; color: #f8fafc; font-size: 0.95rem; resize: none; outline: none; }
        textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: transform 0.1s ease; font-size: 0.9rem; }
        button:active { transform: scale(0.98); }
        .btn-check { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
        .btn-primary { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: white; }
        .btn-secondary { background: rgba(51, 65, 85, 0.6); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.05); }
        .feedback-banner { padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; display: none; }
        .feedback-correct { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #34d399; }
        .feedback-incorrect { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #f87171; }
        .answer-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 1.2rem; display: none; }
        .answer-box.visible { display: block; }
        .section-title { color: #38bdf8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.3rem; }
        .definition-en, .definition-vi { font-size: 0.95rem; margin-bottom: 0.8rem; line-height: 1.4; }
        .definition-vi { color: #34d399; font-weight: 500; }
        .example { font-size: 0.85rem; color: #94a3b8; font-style: italic; border-left: 2px solid #38bdf8; padding-left: 10px; }
        .footer { margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: #64748b; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="brand">Nick.yotris1tg</div>
            <div class="controls">
                <select id="level-filter" onchange="filterDataset()">
                    <option value="ALL">All Levels</option>
                    <option value="B2">Level B2</option>
                    <option value="C1">Level C1</option>
                    <option value="C2">Level C2</option>
                </select>
                <span class="badge" id="level-badge">--</span>
                <span class="badge badge-type" id="type-badge">--</span>
            </div>
        </div>

        <div class="term-container">
            <h1 id="term-display">--</h1>
            <div class="phonetic" id="phonetic-display"></div>
        </div>

        <div class="input-group">
            <label for="user-guess">Your definition guess (Press Enter to check):</label>
            <textarea id="user-guess" placeholder="Write your guess here..."></textarea>
        </div>

        <div id="feedback-banner" class="feedback-banner"></div>

        <div class="btn-group">
            <button class="btn-check" onclick="checkAnswer()">Check Answer</button>
            <button class="btn-secondary" onclick="revealMeaning()">Reveal Only</button>
            <button class="btn-primary" onclick="generateNewTerm()">Next Term</button>
        </div>

        <div class="answer-box" id="answer-box">
            <div class="section-title">English Meaning</div>
            <div class="definition-en" id="definition-en-display"></div>

            <div class="section-title">Nghĩa Tiếng Việt</div>
            <div class="definition-vi" id="definition-vi-display"></div>

            <div class="section-title">Example</div>
            <div class="example" id="example-display"></div>
        </div>

        <div class="footer">
            <span>Filter Enabled Execution</span>
            <span id="pool-count">Pool: 0 terms</span>
        </div>
    </div>

    <script>
        const rawDataset = [
            // B2 Level
            { term: "Substantial", level: "B2", type: "Adjective", phonetic: "/səbˈstæn.ʃəl/", defEN: "Large in amount, value, or importance.", defVI: "Đáng kể, quan trọng, lớn lao.", keywords: ["large", "amount", "important", "đáng kể"], example: "A substantial increase in performance." },
            { term: "Ambiguous", level: "B2", type: "Adjective", phonetic: "/æmˈbɪɡ.ju.əs/", defEN: "Open to more than one interpretation; not clear.", defVI: "Mơ hồ, không rõ ràng.", keywords: ["unclear", "mơ hồ", "không rõ"], example: "The technical documentation contained ambiguous instructions." },
            { term: "Coherent", level: "B2", type: "Adjective", phonetic: "/koʊˈhɪr.ənt/", defEN: "Logical, consistent, and clear in thought or expression.", defVI: "Mạch lạc, chặt chẽ.", keywords: ["logical", "clear", "mạch lạc"], example: "The argument presented was logical and coherent." },
            { term: "Bite the bullet", level: "B2", type: "Idiom", phonetic: "/baɪt ðə ˈbʊl.ɪt/", defEN: "To face a difficult situation with courage and get it over with.", defVI: "Cắn răng chịu đựng, dũng cảm đối mặt.", keywords: ["face", "courage", "cắn răng", "đối mặt"], example: "He decided to bite the bullet and apologize." },
            { term: "Break the ice", level: "B2", type: "Idiom", phonetic: "/breɪk ðə aɪs/", defEN: "To do or say something to relieve tension or start conversation.", defVI: "Phá tan bầu không khí ngột ngạt, làm quen.", keywords: ["start", "tension", "làm quen", "phá tan"], example: "An introductory joke helped break the ice." },
            { term: "Hit the nail on the head", level: "B2", type: "Idiom", phonetic: "/hɪt ðə neɪl ɑːn ðə hed/", defEN: "To describe exactly what is causing a situation or problem.", defVI: "Nói chính xác, đánh đúng trọng tâm.", keywords: ["exact", "correct", "chính xác", "trọng tâm"], example: "Her summary hit the nail on the head." },

            // C1 Level
            { term: "Meticulous", level: "C1", type: "Adjective", phonetic: "/məˈtɪk.jə.ləs/", defEN: "Showing great attention to detail; precise.", defVI: "Tỉ mỉ, cẩn thận.", keywords: ["detail", "careful", "precise", "tỉ mỉ"], example: "System configuration requires meticulous alignment." },
            { term: "Pragmatic", level: "C1", type: "Adjective", phonetic: "/præɡˈmæt.ɪk/", defEN: "Dealing with things sensibly based on practical conditions.", defVI: "Thực tế, chú trọng tính ứng dụng.", keywords: ["practical", "realistic", "thực tế"], example: "A pragmatic approach balances price with durability." },
            { term: "Inherent", level: "C1", type: "Adjective", phonetic: "/ɪnˈhɪr.ənt/", defEN: "Existing in something as a permanent or essential attribute.", defVI: "Vốn có, cố hữu.", keywords: ["essential", "permanent", "vốn có"], example: "Every system design carries an inherent set of trade-offs." },
            { term: "Burning the midnight oil", level: "C1", type: "Idiom", phonetic: "/ˈbɝː.nɪŋ ðə ˈmɪd.naɪt ɔɪl/", defEN: "Working or studying late into the night.", defVI: "Thức khuya làm việc, học tập.", keywords: ["late", "study", "work", "thức khuya"], example: "Students were burning the midnight oil before finals." },
            { term: "Blessing in disguise", level: "C1", type: "Idiom", phonetic: "/ˈbles.ɪŋ ɪn dɪsˈɡaɪz/", defEN: "An apparent misfortune that eventually has good results.", defVI: "Trong cái rủi có cái may.", keywords: ["misfortune", "good result", "cái may", "cái rủi"], example: "Losing that job was a blessing in disguise." },

            // C2 Level
            { term: "Ubiquitous", level: "C2", type: "Adjective", phonetic: "/juːˈbɪk.wə.təs/", defEN: "Present, appearing, or found everywhere.", defVI: "Có mặt ở khắp mọi nơi.", keywords: ["everywhere", "present", "khắp nơi"], example: "USB-C interfaces have become ubiquitous." },
            { term: "Ephemeral", level: "C2", type: "Adjective", phonetic: "/əˈfem.ər.əl/", defEN: "Lasting for a very short time; fleeting.", defVI: "Phù du, ngắn ngủi.", keywords: ["short", "fleeting", "ngắn", "phù du"], example: "Viral trends are remarkably ephemeral." },
            { term: "Paradigm", level: "C2", type: "Noun", phonetic: "/ˈpær.ə.daɪm/", defEN: "A typical pattern or model of something; a world view.", defVI: "Mô hình, phạm trù.", keywords: ["model", "pattern", "mô hình"], example: "The discovery generated a complete paradigm shift." },
            { term: "Steal someone's thunder", level: "C2", type: "Idiom", phonetic: "/stiːl ˈsʌm.wʌnz ˈθʌn.dɚ/", defEN: "To take credit or attention away from someone else.", defVI: "Cướp công, cướp sự chú ý của ai.", keywords: ["credit", "attention", "cướp công", "chú ý"], example: "Announcing her news early stole his thunder." },
            { term: "Through thick and thin", level: "C2", type: "Idiom", phonetic: "/θruː θɪk ænd θɪn/", defEN: "Under all circumstances, no matter how difficult.", defVI: "Vượt qua mọi khó khăn, hoạn nạn.", keywords: ["circumstances", "difficult", "khó khăn", "hoạn nạn"], example: "They remained loyal friends through thick and thin." }
        ];

        let filteredDataset = [...rawDataset];
        let currentItem = null;

        function filterDataset() {
            const selectedLevel = document.getElementById('level-filter').value;
            if (selectedLevel === "ALL") {
                filteredDataset = [...rawDataset];
            } else {
                filteredDataset = rawDataset.filter(item => item.level === selectedLevel);
            }
            document.getElementById('pool-count').textContent = `Pool: ${filteredDataset.length} terms`;
            generateNewTerm();
        }

        function generateNewTerm() {
            if (filteredDataset.length === 0) return;

            currentItem = filteredDataset[Math.floor(Math.random() * filteredDataset.length)];

            document.getElementById('level-badge').textContent = currentItem.level;
            document.getElementById('type-badge').textContent = currentItem.type;
            document.getElementById('term-display').textContent = currentItem.term;
            document.getElementById('phonetic-display').textContent = currentItem.phonetic;
            document.getElementById('definition-en-display').textContent = currentItem.defEN;
            document.getElementById('definition-vi-display').textContent = currentItem.defVI;
            document.getElementById('example-display').textContent = `"${currentItem.example}"`;

            document.getElementById('user-guess').value = '';
            document.getElementById('answer-box').classList.remove('visible');
            
            const feedback = document.getElementById('feedback-banner');
            feedback.style.display = 'none';
            feedback.className = 'feedback-banner';
        }

        function checkAnswer() {
            const userGuess = document.getElementById('user-guess').value.trim().toLowerCase();
            const feedback = document.getElementById('feedback-banner');

            if (!userGuess) {
                feedback.textContent = "⚠️ Please type a guess first!";
                feedback.className = "feedback-banner feedback-incorrect";
                feedback.style.display = "block";
                revealMeaning();
                return;
            }

            const isMatch = currentItem.keywords.some(kw => userGuess.includes(kw.toLowerCase()));

            if (isMatch) {
                feedback.textContent = "✓ Correct match!";
                feedback.className = "feedback-banner feedback-correct";
            } else {
                feedback.textContent = "✕ Incorrect. Check the definition below.";
                feedback.className = "feedback-banner feedback-incorrect";
            }

            feedback.style.display = "block";
            revealMeaning();
        }

        function revealMeaning() {
            document.getElementById('answer-box').classList.add('visible');
        }

        // Initialize App
        filterDataset();

        document.getElementById('user-guess').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                checkAnswer();
            }
        });
    </script>
</body>
</html>
