<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary & Idiom Flashcards</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        #pool-count {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .badges {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .badge {
            background-color: var(--border);
            color: var(--text-primary);
            padding: 0.25rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .term-container {
            margin-bottom: 1.5rem;
        }

        #term-display {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.25rem 0;
        }

        #phonetic-display {
            color: var(--text-secondary);
            font-size: 1rem;
            margin: 0;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.primary-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .feedback-banner {
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .feedback-correct {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .feedback-incorrect {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .answer-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }

        .answer-box.visible {
            display: block;
        }

        .answer-box p {
            margin: 0.5rem 0;
            font-size: 0.95rem;
        }

        .definition-en {
            color: var(--text-primary);
        }

        .definition-vi {
            color: var(--text-secondary);
        }

        .example {
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .next-container {
            margin-top: 1.5rem;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vocabulary Trainer</h1>
            <div class="controls">
                <span id="pool-count">Pool: 0 terms</span>
                <select id="level-filter" onchange="filterDataset()">
                    <option value="ALL">All Levels</option>
                    <option value="B2">B2</option>
                    <option value="C1">C1</option>
                    <option value="C2">C2</option>
                </select>
            </div>
        </header>

        <div class="card">
            <div class="badges">
                <span id="level-badge" class="badge">--</span>
                <span id="type-badge" class="badge">--</span>
            </div>

            <div class="term-container">
                <h2 id="term-display">Loading...</h2>
                <p id="phonetic-display">--</p>
            </div>

            <div class="input-group">
                <input type="text" id="user-guess" placeholder="Type meaning, translation, or keywords...">
                <button class="primary-btn" onclick="checkAnswer()">Submit</button>
            </div>

            <div id="feedback-banner" class="feedback-banner"></div>

            <div id="answer-box" class="answer-box">
                <p class="definition-en"><strong>EN:</strong> <span id="definition-en-display"></span></p>
                <p class="definition-vi"><strong>VI:</strong> <span id="definition-vi-display"></span></p>
                <p class="example"><span id="example-display"></span></p>
            </div>

            <div class="next-container">
                <button class="primary-btn" onclick="generateNewTerm()">Next Term ➔</button>
            </div>
        </div>
    </div>

    <script>
        let rawDataset = [];
        let filteredDataset = [];
        let currentItem = null;

        // Fetch dataset asynchronously from vocabulary.json
      async function loadDataset() {
    try {
        // Use an explicit relative path or resolve against window.location
        const response = await fetch(new URL('vocabulary.json', window.location.href));
        if (!response.ok) throw new Error('Network response was not ok');
        
        rawDataset = await response.json();
        filterDataset();
    } catch (error) {
        console.error('Error loading vocabulary dataset:', error);
        document.getElementById('term-display').textContent = 'Failed to load vocabulary.json';
    }
}

        function filterDataset() {
            const selectedLevel = document.getElementById('level-filter').value;
            if (selectedLevel === "ALL") {
                filteredDataset = [...rawDataset];
            } else {
                filteredDataset = rawDataset.filter(item => item.level === selectedLevel);
            }
            document.getElementById('pool-count').textContent = `Pool: ${filteredDataset.length} terms`;
            generateNewTerm();
        }

        function generateNewTerm() {
            if (filteredDataset.length === 0) {
                document.getElementById('term-display').textContent = 'No terms available';
                return;
            }

            currentItem = filteredDataset[Math.floor(Math.random() * filteredDataset.length)];

            document.getElementById('level-badge').textContent = currentItem.level;
            document.getElementById('type-badge').textContent = currentItem.type;
            document.getElementById('term-display').textContent = currentItem.term;
            document.getElementById('phonetic-display').textContent = currentItem.phonetic;
            document.getElementById('definition-en-display').textContent = currentItem.defEN;
            document.getElementById('definition-vi-display').textContent = currentItem.defVI;
            document.getElementById('example-display').textContent = `"${currentItem.example}"`;

            document.getElementById('user-guess').value = '';
            document.getElementById('answer-box').classList.remove('visible');
            
            const feedback = document.getElementById('feedback-banner');
            feedback.style.display = 'none';
            feedback.className = 'feedback-banner';
        }

        function checkAnswer() {
            if (!currentItem) return;
            
            const userGuess = document.getElementById('user-guess').value.trim().toLowerCase();
            const feedback = document.getElementById('feedback-banner');

            if (!userGuess) {
                feedback.textContent = "⚠️ Please type a guess first!";
                feedback.className = "feedback-banner feedback-incorrect";
                feedback.style.display = "block";
                revealMeaning();
                return;
            }

            const isMatch = currentItem.keywords.some(kw => userGuess.includes(kw.toLowerCase()));

            if (isMatch) {
                feedback.textContent = "✓ Correct match!";
                feedback.className = "feedback-banner feedback-correct";
            } else {
                feedback.textContent = "✕ Incorrect. Check the definition below.";
                feedback.className = "feedback-banner feedback-incorrect";
            }

            feedback.style.display = "block";
            revealMeaning();
        }

        function revealMeaning() {
            document.getElementById('answer-box').classList.add('visible');
        }

        // Initialize script upon page load
        window.addEventListener('DOMContentLoaded', loadDataset);

        // Allow pressing Enter key inside text input to submit answer
        document.getElementById('user-guess').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                checkAnswer();
            }
        });
    </script>
</body>
</html>
